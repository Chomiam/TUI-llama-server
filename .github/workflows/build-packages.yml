name: Build & Package (.deb, .rpm)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build Linux Packages (.deb & .rpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Install nfpm packager
        run: |
          curl -sfL https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_Linux_x86_64.tar.gz | tar -xz -C /tmp nfpm
          sudo mv /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller --clean --distpath ./dist tui-llama-server.spec
          chmod +x ./dist/tui-llama-server
          ./dist/tui-llama-server --detect

      - name: Build Debian (.deb) & RedHat (.rpm) Packages
        run: |
          nfpm pkg --packager deb --target dist/
          nfpm pkg --packager rpm --target dist/
          ls -lh dist/

      - name: Inspect Generated Packages
        run: |
          echo "=== Debian Package Info ==="
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tui-llama-server-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/tui-llama-server
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/tui-llama-server
          generate_release_notes: true
          draft: false
          prerelease: false
